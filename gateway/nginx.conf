# log format: time, caller, request, status
log_format who '$time_local $upstream_http_x_user "$request" $status';

server {
    listen 80;
    client_max_body_size 10m;    # Nginx rejects bodies over 1 MB by default; relaxed for the demo
    access_log /var/log/nginx/access.log who;
    location / {
        proxy_pass http://api:8000;
        proxy_hide_header X-User;    # identity goes to the logs, never to the client
    }
}
